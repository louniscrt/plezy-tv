schema-version = 1

[package]
title = "Plezy TV"
version = "1.0.12"
build-number = 112
id = "fr.plezy.smarttv.vega"
icon = "@image/icon.png"
description = "Plezy Web pour Fire TV Vega OS, interface TV noire et anthracite."

[os.version]
min = "1.2"
target = "1.2"

[needs]

[components]
[[components.interactive]]
id = "fr.plezy.smarttv.vega.main"
runtime-module = "/com.amazon.kepler.runtime.react_native_kepler_4@IReactNativeKepler_0"
launch-type = "singleton"
categories = ["com.amazon.category.main"]

# Vega WebView permits HTTPS; HTTP is limited to the listed local servers.
[network-traffic-policy.cleartext]
allowed-domains = ["192.168.0.89", "192.168.1.253"]

[wants]
[[wants.service]]
id = "com.amazon.webview.renderer_service"
[[wants.service]]
id = "com.amazon.inputmethod.service"
[[wants.service]]
id = "com.amazon.media.server"
[[wants.service]]
id = "com.amazon.mediametrics.service"
[[wants.service]]
id = "com.amazon.mediabuffer.service"
[[wants.service]]
id = "com.amazon.mediatransform.service"
[[wants.service]]
id = "com.amazon.audio.stream"
[[wants.service]]
id = "com.amazon.audio.control"
[[wants.service]]
id = "com.amazon.kepler.ucc.publisher"
[[wants.service]]
id = "com.amazon.gipc.uuid.*"

[offers]
[[offers.service]]
id = "com.amazon.gipc.uuid.*"
