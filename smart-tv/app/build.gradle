    defaultConfig {
        applicationId 'fr.plezy.smarttv'
        minSdk 22
        targetSdk 34
        versionCode 111
        versionName '1.0.11'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
