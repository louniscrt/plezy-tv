name: Android TV compile

on:
  push:
    branches: ['feature/android-tv-native-player']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'
      - name: Compile Android TV application
        run: gradle -p smart-tv :app:assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: plezy-smart-tv-debug
          path: smart-tv/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
