name: Android build

on:
  push:
    branches: ['fix/lecture-tv-reconnexion']
  pull_request:

permissions:
  contents: read

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'
      - run: gradle :app:assembleDebug :app:testDebugUnitTest --no-daemon
